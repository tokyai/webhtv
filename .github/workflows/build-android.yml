name: Build Android (reusable)

# 可复用的 Android 构建单元 —— 只负责**构建并收集产物**，不做发布。
#
# 为什么拆出来：发布（创建 GitHub Release / OCI / CNB 同步）需要**所有平台
# 的产物都就位**才能一次做完，因此发布逻辑统一放在 `release-all.yml`。
# 本文件只做构建，产出一个包含 APK + 更新清单的 artifact。
#
# 单独调用（只打 Android，不发布）：
#   gh workflow run build-android.yml
# 由统一入口调用：
#   release-all.yml → jobs.android → uses: ./.github/workflows/build-android.yml

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag（由统一入口解析后传入，用于写进更新清单的下载地址）"
        required: true
        type: string
      apk_suffix:
        description: "APK 文件名后缀，beta 时为 -beta"
        required: false
        default: ""
        type: string
      channel:
        description: "stable | beta"
        required: false
        default: "stable"
        type: string
      release_notes:
        description: "Release notes"
        required: false
        default: ""
        type: string
    outputs:
      version_name:
        description: "Android versionName"
        value: ${{ jobs.build.outputs.version_name }}
      version_code:
        description: "Android versionCode"
        value: ${{ jobs.build.outputs.version_code }}
      short_sha:
        description: "短提交号"
        value: ${{ jobs.build.outputs.short_sha }}
  # 也允许单独手动触发，方便只验证 Android 构建
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag（留空则用 v<versionName>-yyyyMMddHHmm 占位）"
        required: false
        type: string
      release_channel:
        description: "Release channel"
        required: false
        default: auto
        type: choice
        options: [auto, stable, beta]
      release_notes:
        description: "Release notes"
        required: false
        type: string

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    outputs:
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}
      short_sha: ${{ steps.meta.outputs.short_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify bundled MPV native assets
        run: bash scripts/verify_mpv_native_assets.sh --require-elf

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Run WebSocket danmaku tests
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :app:testMobileArm64_v8aDebugUnitTest \
            --tests 'com.fongmi.android.tv.player.danmaku.*' \
            --no-daemon

      # 解析版本号与发布标签。
      #
      # 统一入口调用时 release_tag 已给定（由入口按同一套规则算好），
      # 这里只做**格式校验**；单独手动触发时才自己推导。
      - name: Resolve release tag
        id: meta
        env:
          IN_RELEASE_TAG: ${{ inputs.release_tag }}
          IN_CHANNEL: ${{ inputs.release_channel }}
        run: |
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)"

          CHANNEL="$IN_CHANNEL"
          if [ -z "$CHANNEL" ] || [ "$CHANNEL" = "auto" ]; then
            if [ "${{ github.ref_name }}" = "fongmi-sync" ]; then
              CHANNEL="beta"
            else
              CHANNEL="stable"
            fi
          fi

          if [ "$CHANNEL" = "beta" ]; then
            APK_SUFFIX="-beta"
            TAG_PATTERN="^v${VERSION_NAME}-beta-[0-9]{12}$"
            TAG_DEFAULT="v${VERSION_NAME}-beta-$(date +%Y%m%d%H%M)"
            TAG_EXPECT="v${VERSION_NAME}-beta-yyyyMMddHHmm"
          else
            APK_SUFFIX=""
            TAG_PATTERN="^v${VERSION_NAME}-[0-9]{12}$"
            TAG_DEFAULT="v${VERSION_NAME}-$(date +%Y%m%d%H%M)"
            TAG_EXPECT="v${VERSION_NAME}-yyyyMMddHHmm"
          fi

          TAG="$IN_RELEASE_TAG"
          if [ -z "$TAG" ]; then
            TAG="$TAG_DEFAULT"
          fi

          # 统一入口会传 tag，此时不该要求它符合 Android 的版本号模式
          # （tag 由 Android 版本号派生，理论上必然匹配；但若入口后续改成
          #   别的规则，这里不该误拦）。因此仅在「自己推导」时才严格校验。
          if [ -z "$IN_RELEASE_TAG" ]; then
            if ! printf '%s' "$TAG" | grep -Eq "$TAG_PATTERN"; then
              echo "::error title=Invalid release tag::Expected $TAG_EXPECT, got: $TAG"
              exit 1
            fi
          fi

          {
            echo "tag=$TAG"
            echo "title=${TAG#v}"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "short_sha=$(git rev-parse --short=7 HEAD)"
            echo "channel=$CHANNEL"
            echo "apk_suffix=$APK_SUFFIX"
          } >> "$GITHUB_OUTPUT"

      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS_BASE64="${RELEASE_KEYSTORE_BASE64:-$KEYSTORE_BASE64}"
          STORE_PASSWORD="${RELEASE_STORE_PASSWORD:-$KEY_PASSWORD}"
          ALIAS="${RELEASE_KEY_ALIAS:-$KEY_ALIAS}"
          KEY_PASS="${RELEASE_KEY_PASSWORD:-$STORE_PASSWORD}"
          if [ -z "$KS_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$ALIAS" ]; then
            echo "::error title=Release signing not configured::Configure RELEASE_KEYSTORE_BASE64, RELEASE_KEY_ALIAS and RELEASE_STORE_PASSWORD in repository secrets."
            exit 1
          fi
          mkdir -p app/signing
          printf '%s' "$KS_BASE64" | base64 --decode > app/signing/release.jks
          {
            echo "storeFile=$GITHUB_WORKSPACE/app/signing/release.jks"
            echo "keyAlias=$ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASS"
          } > local.properties
          echo "Release signing configured"

      # 四个变体 = 手机端(arm64/v7a) + TV 端(arm64/v7a)
      - name: Build four release APKs
        env:
          WEBHTV_RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          WEBHTV_APK_SUFFIX: ${{ steps.meta.outputs.apk_suffix }}
        run: |
          chmod +x ./gradlew
          rm -rf Release/apk
          ./gradlew \
            :app:assembleMobileArm64_v8aRelease \
            :app:assembleMobileArmeabi_v7aRelease \
            :app:assembleLeanbackArm64_v8aRelease \
            :app:assembleLeanbackArmeabi_v7aRelease \
            --no-daemon

      - name: Collect APKs
        run: |
          rm -rf dist
          mkdir -p dist
          cp Release/apk/*.apk dist/
          ls -lh dist/

      # 更新清单（*.json）需要「所有平台产物」的最终下载地址。
      # Android 这份清单只描述 APK，因此可以在本 job 内生成，
      # Release 页面的下载基址由统一入口的 tag 决定，此处已能确定。
      - name: Generate update manifests
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
          GITHUB_RELEASE_DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}
        run: |
          python3 - <<'PY'
          import glob
          import hashlib
          import json
          import os

          tag = "${{ steps.meta.outputs.tag }}"
          # 把输入里的 \n 字面量还原成真实换行（与既有行为一致）
          notes = (
              os.environ.get("RELEASE_NOTES", "")
              .replace("\\r\\n", "\n")
              .replace("\\n", "\n")
              .replace("\\t", "\t")
              .strip()
          )
          release_download_base = os.environ["GITHUB_RELEASE_DOWNLOAD_BASE"]

          for apk in glob.glob("dist/*.apk"):
              base = os.path.splitext(os.path.basename(apk))[0]
              with open(apk, "rb") as fh:
                  content = fh.read()
              data = {
                  "name": tag,
                  "versionName": "${{ steps.meta.outputs.version_name }}",
                  "desc": f"{tag} - ${{ steps.meta.outputs.short_sha }}",
                  "channel": "${{ steps.meta.outputs.channel }}",
                  "code": int("${{ steps.meta.outputs.version_code }}"),
                  "apk": f"{release_download_base}/{base}.apk",
                  "size": len(content),
                  "sha256": hashlib.sha256(content).hexdigest(),
                  "downloads": {
                      "github": {"url": f"{release_download_base}/{base}.apk"},
                  },
              }
              if notes:
                  data["notes"] = notes
              with open(f"dist/{base}.json", "w", encoding="utf-8") as fh:
                  json.dump(data, fh, ensure_ascii=False, indent=2)
                  fh.write("\n")
          PY
          ls -lh dist/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: platform-android
          path: dist/*
          if-no-files-found: error
          retention-days: 30
